<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Basket — CherrisBelle</title>

  <style>
    * { box-sizing: border-box; }
    html,body { height:100%; margin:0; font-family: "Times New Roman", serif; background:#fff; color:#333; }
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    
    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom: 18px;
    }
    .brand { font-size:22px; color:#812b46; font-weight:700; }
    .breadcrumb { font-size:14px; color:#6b4a50; }

    
    .card {
      background: rgba(255,255,255,0.96);
      border-radius:12px;
      padding:18px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.06);
    }

    
    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items:start;
    }

    
    .items {
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .item {
      display:flex;
      gap:14px;
      padding:12px;
      border-radius:10px;
      background: #fff;
      border: 1px solid rgba(200,170,180,0.15);
      align-items:center;
    }

    .thumb {
      width:100px;
      height:100px;
      border-radius:8px;
      background-size:cover;
      background-position:center;
      flex-shrink:0;
      box-shadow: 0 6px 16px rgba(179,94,112,0.06);
    }

    .info {
      flex:1;
      min-width:0;
    }
    .info h3 { margin:0 0 6px 0; font-size:18px; color:#812b46; }
    .info p.desc { margin:0 0 8px 0; color:#6b4a50; font-size:14px; }

    .meta {
      display:flex;
      gap:8px;
      align-items:center;
      margin-top:6px;
      flex-wrap:wrap;
    }

    select.size {
      padding:6px 8px;
      border-radius:6px;
      border:1px solid #e6d7db;
      font-family: "Times New Roman", serif;
    }

    .qty {
      display:flex;
      align-items:center;
      gap:8px;
    }
    .qty button {
      width:30px; height:30px; border-radius:6px; border:none;
      background:#f2c6cf; color:#812b46; cursor:pointer;
      font-weight:700;
    }
    .qty input { width:46px; text-align:center; padding:6px; border-radius:6px; border:1px solid #e6d7db; }

    .right {
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .price {
      font-size:16px;
      font-weight:700;
      color:#4a2b33;
    }

    .remove {
      background:transparent;
      border:none;
      color:#b04a4a;
      cursor:pointer;
      font-size:14px;
    }

    
    .summary {
      background: linear-gradient(180deg,#fff 0%, #fff 60%, #fff);
      padding:18px;
      border-radius:10px;
      border:1px solid rgba(200,170,180,0.12);
    }
    .summary h4 { margin:0 0 10px 0; color:#812b46; }
    .summary .row { display:flex; justify-content:space-between; margin:8px 0; color:#4a2b33; }
    .total { font-size:20px; font-weight:700; color:#812b46; margin-top:8px; }

    .btn {
      display:inline-block;
      width:100%;
      padding:12px;
      background:#812b46;
      color:white;
      text-align:center;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-family: "Times New Roman", serif;
      font-size:16px;
      text-decoration:none;
    }

    .muted { color:#7a5b61; font-size:13px; text-align:center; }

    
    .empty {
      text-align:center; padding:30px 10px; color:#6b4a50;
    }

    @media (max-width: 920px) {
      .cart-grid { grid-template-columns: 1fr; }
      .right { order:2; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top">
      <div>
        <div class="brand">CherrisBelle — Keranjang</div>
        <div class="breadcrumb"></div>
      </div>
      <div class="muted"></div>
    </div>

    <div class="card">
      <div class="cart-grid">
        <!-- LEFT: items -->
        <div>
          <div class="items" id="itemsList">
            <!-- items  -->
          </div>

          <div id="emptyHint" class="empty" style="display:none;">
            Your basket is empty. Visit <a href="SHOP.html">Shop</a> Add item.
          </div>
        </div>

        
        <aside class="right">
          <div class="summary" aria-live="polite">
            <h4>Order Summary</h4>
            <div class="row"><span>Items</span><span id="summaryCount">0</span></div>
            <div class="row"><span>Subtotal</span><span id="summarySubtotal">IDR 0</span></div>
            <div class="row"><span>Shipping</span><span id="summaryShipping">IDR 5</span></div>
            <div class="row total"><span>Total</span><span id="summaryTotal">IDR 0</span></div>
          </div>

          <button id="checkoutBtn" class="btn">Add item</button>
          <a href="payment.html" class="btn" style="background:#d47a8c; margin-top:8px; text-decoration:none;">Continue Shopping</a>
        </aside>
      </div>
    </div>
  </div>

  <!--jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

 
  <script>
    $(function(){
      const $itemsList = $('#itemsList');
      const $emptyHint = $('#emptyHint');
      const SHIPPING = 5; // IDR 5

      
      function loadCart() {
        try {
          const raw = localStorage.getItem('cart');
          if (raw) {
            return JSON.parse(raw);
          }
        } catch(e){}
        
        return [
          { id: 'p1', name: 'Pink Ruffle Blouse', desc: 'Soft cotton ruffle blouse', price: 139000, size: 'M', qty: 1, img: 'https://i.pinimg.com/736x/69/09/28/690928efb7bce2ab96dca2ca601ecdb4.jpg' },
          { id: 'p2', name: 'Sweet Pink Dress', desc: 'Flowy midi dress', price: 45000, size: 'S', qty: 2, img: 'https://i.pinimg.com/736x/69/09/28/690928efb7bce2ab96dca2ca601ecdb4.jpg' }
        ];
      }

      let cart = loadCart();

      function saveCart() {
        try {
          localStorage.setItem('cart', JSON.stringify(cart));
        } catch(e) {
          
        }
      }

      function currencyIDR(n) {
        
        return 'IDR ' + Number(n).toLocaleString('id-ID');
      }

      function render() {
        $itemsList.empty();
        if (!cart || cart.length === 0) {
          $emptyHint.show();
        } else {
          $emptyHint.hide();
          cart.forEach(item => {
            const $item = $(`
              <div class="item" data-id="${item.id}">
                <div class="thumb" style="background-image:url('${item.img}');"></div>

                <div class="info">
                  <h3>${escapeHtml(item.name)}</h3>
                  <p class="desc">${escapeHtml(item.desc)}</p>

                  <div class="meta">
                    <label>
                      Size:
                      <select class="size" aria-label="Choose size">
                        <option ${item.size==='XS'?'selected':''}>XS</option>
                        <option ${item.size==='S'?'selected':''}>S</option>
                        <option ${item.size==='M'?'selected':''}>M</option>
                        <option ${item.size==='L'?'selected':''}>L</option>
                        <option ${item.size==='XL'?'selected':''}>XL</option>
                      </select>
                    </label>

                    <div class="qty" style="margin-left:10px;">
                      <button class="dec" title="Decrease">-</button>
                      <input type="number" min="1" class="qty-input" value="${item.qty}" />
                      <button class="inc" title="Increase">+</button>
                    </div>

                    <div style="margin-left:auto; text-align:right;">
                      <div class="price">${currencyIDR(item.price)}</div>
                      <div style="font-size:13px; color:#6b4a50;">Subtotal: ${currencyIDR(item.price * item.qty)}</div>
                      <button class="remove">Remove</button>
                    </div>
                  </div>
                </div>
              </div>
            `);

            
            $item.find('.size').on('change', function(){
              const val = $(this).val();
              item.size = val;
              saveCart();
            });

            
            $item.find('.inc').on('click', function(){
              item.qty = Number(item.qty) + 1;
              $item.find('.qty-input').val(item.qty);
              saveCart();
              render(); 
            });
            $item.find('.dec').on('click', function(){
              if (item.qty > 1) {
                item.qty = Number(item.qty) - 1;
                $item.find('.qty-input').val(item.qty);
                saveCart();
                render();
              }
            });

            
            $item.find('.qty-input').on('change', function(){
              let v = parseInt($(this).val()) || 1;
              if (v < 1) v = 1;
              item.qty = v;
              saveCart();
              render();
            });

            
            $item.find('.remove').on('click', function(){
              cart = cart.filter(i => i.id !== item.id);
              saveCart();
              render();
            });

            $itemsList.append($item);
          });
        }

        updateSummary();
      }

      function updateSummary() {
        const count = cart.reduce((s,i)=> s + Number(i.qty),0);
        const subtotal = cart.reduce((s,i)=> s + i.price * i.qty,0);
        $('#summaryCount').text(count);
        $('#summarySubtotal').text(currencyIDR(subtotal));
        $('#summaryShipping').text(currencyIDR(cart.length ? SHIPPING : 0));
        $('#summaryTotal').text(currencyIDR(subtotal + (cart.length ? SHIPPING : 0)));
      }

      // Checkout
      $('#checkoutBtn').on('click', function(){
        if (!cart || cart.length === 0) {
          alert('Keranjang kosong. Tambahkan item dulu sebelum checkout.');
          return;
        }
       
        window.location.href = 'PICKUP.html';
      });

      
      function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; });
      }

      
      render();
    });
  </script>
</body>
</html>
