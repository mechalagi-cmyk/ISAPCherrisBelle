<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">

    <style>
       body {
        margin: 0;
        font-family: "Times New Roman", serif;
        background-color: #ffffff;
       }

       .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 60px;
            background: rgba(251, 251, 251, 0.6);
            backdrop-filter: blur(6px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
       }

       .logo {
            font-size: 24px;
            font-weight: bold;
            color: #b35e70;
       }

       .navbar ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
       }

       .navbar a {
            text-decoration: none;
            color: #b35e70;
            font-size: 18px;
            font-family: 'Georgia', serif;
       }

       .contact-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .contact-container h1 {
            font-size: 48px;
            color: #b35e70;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">CompKids Project</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
      </ul>
    </nav>
</header>

<div class="contact-container">
    <h1>Thankyou For Shopping</h1>

    <!-- pick up -->
    <a href="PICKUP.html" 
       style="display:inline-block; background:#b35e70; color:white; padding:10px 25px; 
              border-radius:8px; text-decoration:none; margin-top:20px;">
        Schedule Pickup
    </a>
</div>

</body>
</html>
